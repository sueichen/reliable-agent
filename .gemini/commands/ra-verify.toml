description = "运行自动化验证——完整测试套件、lint、构建（含编译器警告扫描）和类型检查。全部零错误零警告通过才能进入审查"

prompt = """
Invoke the ra-verify skill.

运行 CLAUDE.md 中定义的所有验证命令：
1. 运行带覆盖率的完整测试套件
2. 运行 lint
3. 运行构建（含编译器警告扫描——捕获输出中的 compiler warning）
4. 扫描构建输出中的 compiler warning：匹配 warning 模式 → 过滤第三方路径 → 应用白名单 → 0 warning 方可通过
5. 运行类型检查（TypeScript 项目）
6. 检查新代码有对应测试（覆盖分析）
7. 验证无未引用的 TODO/FIXME 注释
8. 输出验证报告：每类 pass/fail、覆盖摘要、lint 错误数、compiler warnings 数（含 file:line:message 清单）

门禁：如果任何检查失败，返回 ra-build。在所有条件全绿之前不要进入审查。
"""
