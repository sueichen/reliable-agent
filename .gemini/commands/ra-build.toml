description = "TDD 增量实现——红绿重构循环。一次一个测试、一个实现切片、一次重构"

prompt = """
Invoke the ra-build skill.

TDD 工作流：
1. 从方案中选择下一个待办任务
2. 读取任务验收标准和相关上下文（CLAUDE.md、已有代码、模式、类型）
3. RED：为预期行为编写一个失败的测试（测试描述行为，不描述实现）
4. GREEN：实现使测试通过的最小代码
5. Verify：运行完整测试套件检查回归
6. REFACTOR：在测试保持绿色的前提下清理——提取重复、深化模块、自然应用 SOLID
7. Commit：遵循项目的 commit 格式提交
8. 重复下一任务

使用 `auto` 模式可在一次批准的流程中构建所有任务。
"""
